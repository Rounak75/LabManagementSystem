appId: com.golmurijanchghar.lab
productName: "Golmuri Janch Ghar Lab"
electronVersion: "33.0.0"
directories:
  buildResources: resources
  output: out/dist
files:
  - "out/main/**"
  - "out/preload/**"
  - "out/renderer/**"
  - "package.json"
  - "!**/.env"
extraResources:
  # Built by `pnpm -F @lab/db build:seed-db`, which the package/release scripts
  # run first. This used to point at prisma/dev.sqlite — the developer's own
  # working database — so whatever was in it at package time (test patients, dev
  # admin accounts) became the lab's starting data. The build script creates this
  # file from the migrations plus the seed and fails if it contains any patient,
  # visit or user rows.
  - from: "../../packages/db/prisma/seed.sqlite"
    to:   "lab.sqlite"
  - from: "../../packages/db/prisma/schema.prisma"
    to:   "prisma/schema.prisma"
  - from: "../../packages/db/prisma/migrations"
    to:   "prisma/migrations"
asarUnpack:
  - "**/node_modules/@prisma/client/**"
  - "**/node_modules/.prisma/**"
  - "**/node_modules/better-sqlite3/**"
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish:
  provider: github
  owner: Rounak75
  repo: LabManagementSystem
